# fx-nginx-ийн conf.d хавтаст хуулна
server {
    listen 80;
    listen [::]:80;
    server_name yesuvd.tech www.yesuvd.tech;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://yesuvd.tech$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yesuvd.tech www.yesuvd.tech;

    ssl_certificate     /etc/letsencrypt/live/yesuvd.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yesuvd.tech/privkey.pem;

    if ($host = www.yesuvd.tech) { return 301 https://yesuvd.tech$request_uri; }

    client_max_body_size 5m; # зураг, CV upload (4MB хүртэл)

    # portfolio container унтарсан үед ч nginx асах боломжтой байхаар хувьсагчаар хандана
    resolver 127.0.0.11 valid=30s;
    set $portfolio http://portfolio:3000;

    location / {
        proxy_pass $portfolio;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
