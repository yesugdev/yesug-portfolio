services:
  app:
    build: .
    image: portfolio-app
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/portfolio
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      default:
      proxy:
        # nginx энэ нэрээр хандана (бусад төслийн "app"-тай давхцахгүй)
        aliases: [portfolio]

  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-fx_default}

volumes:
  # external: "docker compose down -v" ч энэ volume-ийг устгахгүй.
  # Анх удаа: docker volume create portfolio_mongo-data
  mongo-data:
    external: true
    name: portfolio_mongo-data
